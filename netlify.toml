[build]
  command = "npm run build"
  publish = "dist"

# Same-origin proxy to the LearnLoop API (the backend sends no CORS headers).
[[redirects]]
  from = "/api/public/*"
  to = "https://learnloop-slide-weaver.lovable.app/api/public/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
